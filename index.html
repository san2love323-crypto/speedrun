<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한국 스피드런 포럼</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--blue:#1f4f9c;--blue-d:#173c78;--bg:#f6f7f9;--card:#fff;--line:#e5e7eb;--txt:#111827;--mut:#6b7280;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--gold:#ca8a04}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Pretendard,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;font-size:15px}
a{color:var(--blue);text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hwrap{max-width:1500px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:0 20px;height:56px}
.logo{font-weight:800;font-size:18px;color:var(--txt);margin-right:12px;white-space:nowrap}
.logo span{color:var(--blue)}
nav a{padding:18px 12px;display:inline-block;color:#374151;font-weight:600;border-bottom:2px solid transparent}
nav a.on{color:var(--txt);border-bottom-color:var(--txt)}
.spacer{flex:1}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--blue-d)}
.btn.ghost{background:#fff;color:var(--txt);border:1px solid var(--line)}
.btn.ghost:hover{background:#f3f4f6}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.warn{background:var(--warn)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.layout{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 56px)}
.layout.full{grid-template-columns:1fr}
aside{background:#fff;border-right:1px solid var(--line);padding:16px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
.side-title{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800;margin:4px 0 12px}
.side-title small{font-weight:600;color:var(--mut);font-size:14px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:#fff}
.search input{border:0;outline:0;flex:1;font-size:14px}
.side-sub{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin:14px 0 6px}
.glist a{display:grid;grid-template-columns:34px 1fr;align-items:center;padding:12px 8px;border-radius:8px;color:var(--txt)}
.glist a:hover{background:#f3f4f6}
.glist a.on{background:#eaf0fb}
.glist .no{color:var(--mut);font-weight:700}
.glist .nm{font-weight:700;font-size:15px}
.glist .meta{font-size:12.5px;color:var(--mut)}
main{padding:24px 28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.grid2{display:grid;grid-template-columns:1fr 380px;gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
h1{font-size:32px;margin:0;display:flex;align-items:center;gap:16px}
h1 .rank{color:var(--txt);font-weight:900;padding-right:16px;border-right:2px solid var(--line)}
h2{font-size:18px;margin:0 0 12px}
.sub{color:var(--mut);margin:8px 0 18px}
.sub b{color:var(--txt)}
table{width:100%;border-collapse:collapse}
th{font-weight:600;color:var(--mut);font-size:13px;text-align:left;padding:10px 12px;background:#f9fafb;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid #f1f2f4;vertical-align:middle}
tr:last-child td{border-bottom:0}
.mono{font-variant-numeric:tabular-nums;font-weight:700}
.empty{color:var(--mut);text-align:center;padding:40px 0}
.info{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px}
.info .k{font-size:13px;color:var(--mut);margin-bottom:4px}
.info .v{font-weight:700;font-size:17px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tag{border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:13px;background:#fff}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:10px 14px;font-weight:700;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--txt);border-bottom-color:var(--txt)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700}
.b-pending{background:#fef3c7;color:#92400e}.b-approved{background:#dbeafe;color:#1e40af}.b-published{background:#dcfce7;color:#166534}.b-rejected{background:#fee2e2;color:#991b1b}
.b-ai{background:#ede9fe;color:#5b21b6}.b-admin{background:#e5e7eb;color:#374151}
.field{margin-bottom:18px}
.field label{display:block;font-weight:700;margin-bottom:8px}
.field label small{color:var(--bad);font-weight:600;font-size:12px;margin-left:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:#fff;outline:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue)}
.field .hint{color:var(--mut);font-size:13px;margin-top:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.guide{background:#f3f4f6;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:20px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:14px;padding:26px;width:420px;max-width:94vw;max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;display:none;z-index:60}
.toast.on{display:block}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .n{font-size:28px;font-weight:900}.stat .l{color:var(--mut);font-size:13px}
.user-link{font-weight:700;color:var(--txt)}
.user-link:hover{color:var(--blue)}
.yt{display:inline-flex;align-items:center;gap:4px;color:var(--bad);font-weight:700;font-size:13px}
.hard-item{display:grid;grid-template-columns:70px 1fr auto;gap:16px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px}
.hard-item .pos{font-size:28px;font-weight:900;color:var(--txt)}
.hard-item .t{font-size:18px;font-weight:800}
.hard-item .d{color:var(--mut);font-size:13px;margin-top:4px}
.pts{background:#fef9c3;color:#854d0e;padding:4px 10px;border-radius:8px;font-weight:800;white-space:nowrap}
.gacha-box{display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 10px}
.gacha-card{width:320px;min-height:150px;border-radius:16px;border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#fff;text-align:center;transition:transform .15s}
.gacha-card.spin{animation:shake .12s infinite}
@keyframes shake{0%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}100%{transform:rotate(-2deg)}}
.r-common{border-color:#9ca3af}.r-rare{border-color:#3b82f6;box-shadow:0 0 18px #3b82f655}.r-epic{border-color:#8b5cf6;box-shadow:0 0 22px #8b5cf677}.r-legend{border-color:#f59e0b;box-shadow:0 0 28px #f59e0b99}
.timer-big{font-size:56px;font-weight:900;font-variant-numeric:tabular-nums;text-align:center;letter-spacing:1px}
.splits{margin-top:10px}
.mini{font-size:13px;color:var(--mut)}
.admin-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sub-card{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;background:#fff}
.sub-card .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.sub-card .kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px 16px;margin:12px 0;font-size:13.5px}
.sub-card .kv b{color:var(--mut);font-weight:600;margin-right:6px}
.idle{font-size:13px;padding:8px 12px;border-radius:8px;background:#ecfdf5;color:#065f46;display:inline-block}
.idle.off{background:#fef2f2;color:#991b1b}
.rank-badge{display:inline-block;width:28px;height:28px;border-radius:50%;line-height:28px;text-align:center;font-weight:900;font-size:13px;background:#f3f4f6}
.rank-1{background:#fde68a;color:#78350f}.rank-2{background:#e5e7eb;color:#374151}.rank-3{background:#fed7aa;color:#7c2d12}
.avatar{display:inline-block;width:34px;height:34px;border-radius:8px;background:var(--blue);color:#fff;font-weight:900;text-align:center;line-height:34px;font-size:15px}
.setup{max-width:720px;margin:60px auto;padding:30px}
code{background:#f3f4f6;padding:2px 6px;border-radius:5px;font-size:13px}
@media (max-width:1000px){.layout{grid-template-columns:1fr}aside{position:static;height:auto;max-height:300px}.grid2,.grid3,.row2{grid-template-columns:1fr}h1{font-size:24px}}
</style>
</head>
<body>
<header><div class="hwrap">
  <a class="logo" href="#/">KR<span>SPEEDRUN</span> 포럼</a>
  <nav id="nav">
    <a href="#/" data-r="home">홈</a>
    <a href="#/games" data-r="games">게임</a>
    <a href="#/ranking" data-r="ranking">유저 랭킹</a>
    <a href="#/hardest" data-r="hardest">최고 난이도</a>
    <a href="#/tools" data-r="tools">도구</a>
    <a href="#/me" data-r="me" id="nav-me" style="display:none">내 제출</a>
    <a href="#/admin" data-r="admin" id="nav-admin" style="display:none">관리자</a>
  </nav>
  <div class="spacer"></div>
  <span id="auth-area"></span>
</div></header>

<div id="app"></div>
<div class="modal-bg" id="modal"><div class="modal" id="modal-body"></div></div>
<div class="toast" id="toast"></div>

<script>
// ======================= 설정 =======================
// Supabase 대시보드 > Project Settings > API 에서 복사
const SUPABASE_URL = "https://nfsmdkoskebznirdytvs.supabase.co/rest/v1/";        // 예: https://abcdefgh.supabase.co
const SUPABASE_ANON_KEY = "sb_publishable_iGjHacKLhTSF5PbaXCDyxQ_klG8QZzz";
// ====================================================

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast = (m, ms=2600) => { const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"), ms); };
const fmt = ms => { ms=Number(ms)||0; const h=Math.floor(ms/3600000), m=Math.floor(ms%3600000/60000), s=Math.floor(ms%60000/1000), cs=Math.floor(ms%1000/10);
  return (h?h+":":"")+String(m).padStart(h?2:1,"0")+":"+String(s).padStart(2,"0")+"."+String(cs).padStart(2,"0"); };
const fmtDate = d => d ? new Date(d).toLocaleDateString("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit"}) : "-";
const fmtDT = d => d ? new Date(d).toLocaleString("ko-KR",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}) : "-";
function parseTime(str){ // "1:23:45.67" / "23:45" / "45.5" / "1h 2m 3s"
  str=String(str).trim(); if(!str) return null;
  let m=str.match(/^(?:(\d+)h)?\s*(?:(\d+)m)?\s*(?:(\d+(?:\.\d+)?)s)?$/i);
  if(m && (m[1]||m[2]||m[3])) return Math.round(((+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0))*1000);
  const parts=str.split(":"); if(parts.length>3||parts.some(p=>p===""||isNaN(p))) return null;
  let sec=0; for(const p of parts) sec=sec*60+parseFloat(p);
  return Math.round(sec*1000);
}
const ytId = u => { const m=String(u||"").match(/(?:v=|youtu\.be\/|shorts\/|live\/)([\w-]{11})/); return m?m[1]:null; };
const isYt = u => /^(https?:\/\/)?(www\.|m\.)?(youtube\.com|youtu\.be)\//i.test(String(u||""));

let sb=null, me=null, profile=null, games=[], gameStats={}, settings={};
const isAdmin = () => profile && profile.role==="admin" && !profile.banned;

function openModal(html){ $("#modal-body").innerHTML=html; $("#modal").classList.add("on"); }
function closeModal(){ $("#modal").classList.remove("on"); }
$("#modal").addEventListener("click", e=>{ if(e.target.id==="modal") closeModal(); });

// ======================= 초기화 =======================
async function init(){
  if(SUPABASE_URL.startsWith("YOUR_")){ $("#app").innerHTML=`<div class="card setup"><h1>⚙️ 설정이 필요해요</h1><p>index.html 상단의 <code>SUPABASE_URL</code> 과 <code>SUPABASE_ANON_KEY</code> 를 Supabase 프로젝트 값으로 바꿔주세요. README.md 를 참고하세요.</p></div>`; return; }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange(async (_e, session)=>{ me=session?.user||null; await loadProfile(); renderAuth(); route(); });
  const { data:{ session } } = await sb.auth.getSession(); me=session?.user||null;
  await Promise.all([loadProfile(), loadGames(), loadSettings()]);
  renderAuth(); route();
  window.addEventListener("hashchange", route);
  setInterval(heartbeat, 30000);
}
async function loadProfile(){ profile=null; if(!me) return; const {data}=await sb.from("profiles").select("*").eq("id",me.id).single(); profile=data; heartbeat(); }
async function loadGames(){ const [{data:g},{data:s}]=await Promise.all([sb.from("games").select("*").order("name"), sb.rpc("game_stats")]);
  games=g||[]; gameStats={}; (s||[]).forEach(r=>gameStats[r.game_id]=r); }
async function loadSettings(){ const {data}=await sb.from("settings").select("*"); settings={}; (data||[]).forEach(r=>settings[r.key]=r.value); }
async function heartbeat(){ if(isAdmin() && document.visibilityState==="visible") await sb.rpc("admin_heartbeat"); }

function renderAuth(){
  $("#nav-me").style.display = me?"":"none";
  $("#nav-admin").style.display = isAdmin()?"":"none";
  $("#auth-area").innerHTML = me
    ? `<a href="#/user/${encodeURIComponent(profile?.nickname||"")}" class="user-link" style="margin-right:10px"><span class="avatar" style="width:28px;height:28px;line-height:28px;font-size:12px;margin-right:6px">${esc((profile?.nickname||"?")[0])}</span>${esc(profile?.nickname||"")}${isAdmin()?' <span class="badge b-admin">관리자</span>':''}</a><button class="btn ghost sm" onclick="logout()">로그아웃</button>`
    : `<button class="btn ghost sm" onclick="authModal('login')">로그인</button> <button class="btn sm" onclick="authModal('signup')">회원가입</button>`;
}
function authModal(mode){
  openModal(`<h2>${mode==="login"?"로그인":"회원가입"}</h2>
  ${mode==="signup"?`<div class="field"><label>닉네임 <small>필수</small></label><input id="a-nick" placeholder="포럼에서 사용할 닉네임" maxlength="20"></div>`:""}
  <div class="field"><label>이메일</label><input id="a-email" type="email" placeholder="you@example.com"></div>
  <div class="field"><label>비밀번호</label><input id="a-pw" type="password" placeholder="6자 이상" onkeydown="if(event.key==='Enter')doAuth('${mode}')"></div>
  <button class="btn" style="width:100%;justify-content:center" onclick="doAuth('${mode}')">${mode==="login"?"로그인":"가입하기"}</button>
  <p class="mini" style="text-align:center;margin-top:12px">${mode==="login"?`계정이 없나요? <a href="javascript:authModal('signup')">회원가입</a>`:`이미 계정이 있나요? <a href="javascript:authModal('login')">로그인</a>`}</p>`);
}
async function doAuth(mode){
  const email=$("#a-email").value.trim(), password=$("#a-pw").value;
  if(mode==="signup"){ const nickname=$("#a-nick").value.trim(); if(nickname.length<2) return toast("닉네임은 2자 이상");
    const {error}=await sb.auth.signUp({email,password,options:{data:{nickname}}}); if(error) return toast("가입 실패: "+error.message);
    toast("가입 완료! (이메일 인증이 켜져 있으면 메일을 확인하세요)"); }
  else { const {error}=await sb.auth.signInWithPassword({email,password}); if(error) return toast("로그인 실패: "+error.message); toast("환영합니다!"); }
  closeModal();
}
async function logout(){ await sb.auth.signOut(); location.hash="#/"; }

// ======================= 라우팅 =======================
function route(){
  const h=location.hash||"#/"; const [path,...rest]=h.slice(2).split("/"); const r=path||"home";
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on", a.dataset.r===r));
  clearInterval(window._poll);
  const P={home:pageHome, games:pageGames, game:()=>pageGame(+rest[0], rest[1]), ranking:pageRanking, hardest:pageHardest, tools:pageTools,
           submit:()=>pageSubmit(rest[0]), me:pageMe, user:()=>pageUser(decodeURIComponent(rest.join("/"))), admin:pageAdmin};
  (P[r]||pageHome)();
  window.scrollTo(0,0);
}
function shell(mainHtml, {sidebar=true, selected=null}={}){
  $("#app").innerHTML = sidebar
    ? `<div class="layout"><aside>${sidebarHtml(selected)}</aside><main>${mainHtml}</main></div>`
    : `<div class="layout full"><main>${mainHtml}</main></div>`;
  if(sidebar) $("#g-search")?.addEventListener("input", e=>{ $("#glist").innerHTML=gameListHtml(e.target.value, selected); });
}
function sidebarHtml(selected){ return `<div class="side-title">게임 목록 <small>${games.length}</small></div>
  <div class="search">🔍 <input id="g-search" placeholder="게임 이름 또는 약칭 검색"></div>
  <div class="side-sub"><span>기록 많은 순</span><span>${games.length}개</span></div><div class="glist" id="glist">${gameListHtml("",selected)}</div>`; }
function sortedGames(q){ q=(q||"").toLowerCase(); return games.filter(g=>!q||g.name.toLowerCase().includes(q)||(g.abbr||"").toLowerCase().includes(q)||(g.genre||"").includes(q))
  .sort((a,b)=>(gameStats[b.id]?.records||0)-(gameStats[a.id]?.records||0)||a.name.localeCompare(b.name)); }
function gameListHtml(q,selected){ const list=sortedGames(q).slice(0,300);
  return list.map((g,i)=>`<a href="#/game/${g.id}" class="${g.id===selected?"on":""}"><span class="no">${i+1}</span><span><div class="nm">${esc(g.name)}</div><div class="meta">${esc(g.genre||"")}${g.release_year?" · "+g.release_year:""} · 기록 ${gameStats[g.id]?.records||0}</div></span></a>`).join("")||`<div class="empty">검색 결과 없음</div>`; }

// ======================= 홈 =======================
async function pageHome(){
  shell(`<div class="card" style="text-align:center;padding:40px"><div class="mini">불러오는 중…</div></div>`);
  const [{data:recent},{data:rank},{data:hard},{count:recCount},{count:userCount}]=await Promise.all([
    sb.from("records").select("*, profiles(nickname), games(name), categories(name)").order("achieved_at",{ascending:false}).limit(12),
    sb.rpc("user_ranking"), sb.from("hardest").select("*, games(name)").order("position").limit(5),
    sb.from("records").select("*",{count:"exact",head:true}), sb.from("profiles").select("*",{count:"exact",head:true})]);
  shell(`
  <div class="grid3" style="margin-bottom:20px">
    <div class="card stat"><div class="n">${games.length.toLocaleString()}</div><div class="l">등록된 게임</div></div>
    <div class="card stat"><div class="n">${(recCount||0).toLocaleString()}</div><div class="l">고정된 기록</div></div>
    <div class="card stat"><div class="n">${(userCount||0).toLocaleString()}</div><div class="l">러너</div></div>
  </div>
  <div class="grid2">
    <div class="card"><h2>🕒 최근 고정된 기록</h2>
      ${recent?.length?`<table><tr><th>게임</th><th>카테고리</th><th>유저</th><th>기록</th><th>날짜</th></tr>${recent.map(r=>`<tr><td><a href="#/game/${r.game_id}"><b>${esc(r.games?.name)}</b></a></td><td>${esc(r.categories?.name)}</td><td><a class="user-link" href="#/user/${encodeURIComponent(r.profiles?.nickname)}">${esc(r.profiles?.nickname)}</a></td><td class="mono">${fmt(r.time_ms)}</td><td class="mini">${fmtDate(r.achieved_at)}</td></tr>`).join("")}</table>`:`<div class="empty">아직 기록이 없어요. 첫 기록을 제출해보세요!</div>`}
      <div style="margin-top:16px"><a class="btn" href="#/submit">＋ 기록 제출</a></div></div>
    <div>
      <div class="card" style="margin-bottom:20px"><h2>🏆 유저 랭킹 TOP 5</h2>

function toolTab(btn,id){ document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("on")); btn.classList.add("on"); ["t-gacha","t-timer","t-calc","t-roulette"].forEach(t=>$("#"+t).style.display=t===id?"":"none"); }
function pickRarity(){ const r=Math.random(); return r<.03?"legend":r<.13?"epic":r<.40?"rare":"common"; }
function gachaOne(){ const rar=pickRarity(); const pool=sortedGames(""); let g;
  if(rar==="legend") g=pool.slice(0,Math.max(5,Math.ceil(pool.length*.03)))[Math.floor(Math.random()*Math.max(5,Math.ceil(pool.length*.03)))];

  else g=pool[Math.floor(Math.random()*pool.length)];
  return {rar,g}; }
const RAR_KO={common:"일반",rare:"레어",epic:"에픽",legend:"전설"};
async function gacha(n=1){ const card=$("#gacha-card"); card.className="gacha-card spin"; card.innerHTML=`<div style="font-size:40px">🎲</div><div class="mini">두구두구…</div>`;
  await new Promise(r=>setTimeout(r,900)); const res=Array.from({length:n},gachaOne); const best=res.sort((a,b)=>["common","rare","epic","legend"].indexOf(b.rar)-["common","rare","epic","legend"].indexOf(a.rar))[0];
  card.className="gacha-card r-"+best.rar; card.innerHTML=`<div class="mini">${RAR_KO[best.rar]}${best.rar==="legend"?" ✨":""}</div><div style="font-size:22px;font-weight:900">${esc(best.g.name)}</div><div class="mini">${esc(best.g.genre||"")} · 기록 ${gameStats[best.g.id]?.records||0}개</div><a class="btn sm" href="#/game/${best.g.id}" style="margin-top:8px">이 게임 도전하기 →</a>`;
  if(n>1) $("#gacha-log").innerHTML=`<table><tr><th>#</th><th>희귀도</th><th>게임</th></tr>${res.map((r,i)=>`<tr><td>${i+1}</td><td><span class="badge" style="background:${{common:"#e5e7eb",rare:"#dbeafe",epic:"#ede9fe",legend:"#fef3c7"}[r.rar]}">${RAR_KO[r.rar]}</span></td><td><a href="#/game/${r.g.id}">${esc(r.g.name)}</a></td></tr>`).join("")}</table>`; else $("#gacha-log").innerHTML=""; }
const CHALLENGES=["마우스 반전으로 클리어","키보드 한 손만 사용","1시간 안에 새 게임 Any% 완주","지금 가챠에서 뽑힌 게임 WR 영상 안 보고 도전","세이브 없이 완주","음소거 플레이","자신의 PB를 5% 단축","가장 기록 적은 게임의 첫 기록 되기","채팅 추천 게임 즉석 도전","도구 탭 타이머로 10분 챌린지"];
function roulette(){ const c=$("#rou-card"); c.className="gacha-card spin"; setTimeout(()=>{ c.className="gacha-card r-rare"; const {g}=gachaOne(); c.innerHTML=`<div class="mini">오늘의 챌린지</div><div style="font-size:19px;font-weight:900">${esc(CHALLENGES[Math.floor(Math.random()*CHALLENGES.length)])}</div><div class="mini">대상 게임: <a href="#/game/${g.id}">${esc(g.name)}</a></div>`; },800); }
let tmRun=false, tmStart=0, tmAcc=0, tmRaf=null, tmSplits=[];
function tmTick(){ $("#tm").textContent=fmt(tmAcc+(tmRun?performance.now()-tmStart:0)); if(tmRun) tmRaf=requestAnimationFrame(tmTick); }
function tmToggle(){ if(tmRun){ tmAcc+=performance.now()-tmStart; tmRun=false; cancelAnimationFrame(tmRaf); $("#tm-start").textContent="재개 (Space)"; tmTick(); } else { tmRun=true; tmStart=performance.now(); $("#tm-start").textContent="정지 (Space)"; tmTick(); } }
function tmSplit(){ if(!tmRun) return; const t=tmAcc+performance.now()-tmStart; const prev=tmSplits.length?tmSplits[tmSplits.length-1]:0; tmSplits.push(t); $("#tm-splits").innerHTML=`<tr><th>#</th><th>구간</th><th>누적</th></tr>`+tmSplits.map((s,i)=>`<tr><td>${i+1}</td><td class="mono">${fmt(s-(i?tmSplits[i-1]:0))}</td><td class="mono">${fmt(s)}</td></tr>`).join(""); }
function tmReset(){ tmRun=false; cancelAnimationFrame(tmRaf); tmAcc=0; tmSplits=[]; $("#tm").textContent="0:00.00"; $("#tm-splits").innerHTML=""; $("#tm-start").textContent="시작 (Space)"; }
function calc(op){ const a=parseTime($("#c-a").value), b=parseTime($("#c-b").value); const o=$("#c-out");
  if(op==="ms") return o.textContent=a==null?"기록 A 형식 오류":`${a.toLocaleString()} ms`;

async function onGamePick(){ const name=$("#s-game").value; const g=games.find(x=>x.name===name); const sel=$("#s-cat"); if(!g){ sel.innerHTML=`<option value="">게임을 먼저 선택</option>`; return; }
  const {data}=await sb.from("categories").select("*").eq("game_id",g.id).order("id"); sel.innerHTML=(data||[]).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")||`<option value="">카테고리 없음 (관리자에게 요청)</option>`; sel.onchange=showWr; showWr(); }
async function showWr(){ const cid=+$("#s-cat").value; if(!cid) return; const {data}=await sb.rpc("leaderboard",{p_category:cid}); $("#s-cat-hint").textContent=data?.length?`현재 1위: ${fmt(data[0].time_ms)} (${data[0].nickname}) · 등재 ${data.length}개`:"아직 기록이 없는 카테고리 — 첫 기록이 됩니다!"; }
async function submitRecord(){
  if(!$("#s-agree").checked) return toast("가이드라인 동의가 필요해요");
  const g=games.find(x=>x.name===$("#s-game").value); if(!g) return toast("목록에서 게임을 선택하세요");
  const category_id=+$("#s-cat").value; if(!category_id) return toast("카테고리를 선택하세요");
  const time_ms=parseTime($("#s-time").value); if(!time_ms) return toast("기록 시간 형식이 잘못됐어요");
  const video_url=$("#s-video").value.trim(); if(!isYt(video_url)) return toast("YouTube 링크만 제출할 수 있어요");
  const raw_video_url=$("#s-raw").value.trim(); if(!raw_video_url) return toast("무편집 원본 영상 링크가 필요해요");
  const fps=$("#s-fps").value?+$("#s-fps").value:null;
  const {error}=await sb.from("submissions").insert({user_id:me.id, game_id:g.id, category_id, time_ms, game_version:$("#s-version").value||null, platform:$("#s-platform").value, fps, timer_tool:$("#s-timer").value, video_url, raw_video_url, note:$("#s-note").value||null});
  if(error) return toast("제출 실패: "+(error.message.includes("policy")?"7일 10개 제한 또는 정지된 계정":error.message), 4000);
  toast("제출 완료! 심사 후 리더보드에 반영됩니다."); location.hash="#/me";
}
async function submitGameReq(){ const name=$("#s-newgame").value.trim(); if(!name) return toast("게임 이름을 입력하세요");
  // 게임 추가 요청은 "게임 추가 요청" 전용 게임/카테고리 행에 기록 (관리자 탭에서 확인)
  let {data:req}=await sb.from("games").select("id").eq("abbr","__requests").maybeSingle();

  const rk={}; (rank||[]).forEach(r=>rk[r.user_id]=r);
  $("#admin-body").innerHTML=`<div class="mini" style="margin-bottom:10px">📌 유저 랭킹 순위 고정: 숫자를 넣으면 유저 랭킹에서 그 순위로 강제됩니다.</div><div class="card" style="padding:0"><table><tr><th>닉네임</th><th>역할</th><th>현재 랭킹</th><th>TOP100</th><th>📌 고정 순위</th><th>가입</th><th></th></tr>
  ${(users||[]).map(u=>`<tr><td><a class="user-link" href="#/user/${encodeURIComponent(u.nickname)}">${esc(u.nickname)}</a> ${u.banned?'<span class="badge b-rejected">정지</span>':''}</td><td><select onchange="setRole('${u.id}',this.value)" ${u.id===me.id?"disabled":""}><option ${u.role==="user"?"selected":""} value="user">user</option><option ${u.role==="admin"?"selected":""} value="admin">admin</option></select></td><td>${rk[u.id]?"#"+rk[u.id].rank:"-"}</td><td>${rk[u.id]?.top100||0}</td><td><input type="number" value="${u.manual_rank??""}" placeholder="자동" style="width:70px;border:1px solid var(--line);border-radius:6px;padding:4px 6px" onchange="setUserRank('${u.id}',this.value)"></td><td class="mini">${fmtDate(u.created_at)}</td><td>${u.id!==me.id?`<button class="btn ${u.banned?"ok":"bad"} sm" onclick="banUser('${u.id}',${!u.banned})">${u.banned?"정지 해제":"정지"}</button> <button class="btn ghost sm" onclick="renameUser('${u.id}','${esc(u.nickname)}')">이름 변경</button>`:""}</td></tr>`).join("")}</table></div>`;
}
async function setRole(id,role){ await sb.from("profiles").update({role}).eq("id",id); toast("역할 변경됨"); }
async function setUserRank(id,v){ await sb.rpc("set_user_rank",{p_user:id,p_rank:v===""?null:+v}); toast("저장됨"); }
async function banUser(id,b){ await sb.from("profiles").update({banned:b}).eq("id",id); adUsers(); }
async function renameUser(id,old){ const n=prompt("새 닉네임",old); if(!n||n===old) return; const {error}=await sb.from("profiles").update({nickname:n}).eq("id",id); if(error) return toast(error.message); adUsers(); }

async function adGames(){
  const sel=window._adGame||null; const g=games.find(x=>x.id===sel);
  const {data:cats}=g?await sb.from("categories").select("*").eq("game_id",g.id).order("id"):{data:[]};
  $("#admin-body").innerHTML=`<div class="grid2">
  <div><div class="card" style="margin-bottom:16px"><h2>➕ 게임 직접 추가</h2><div class="row2"><div class="field"><label>이름</label><input id="ng-name"></div><div class="field"><label>약칭 (영문, 고유)</label><input id="ng-abbr" placeholder="예: pizzatower"></div></div>
    <div class="row2"><div class="field"><label>장르</label><input id="ng-genre"></div><div class="field"><label>출시년도</label><input id="ng-year" type="number"></div></div>
    <div class="field"><label>카테고리 (| 로 구분)</label><input id="ng-cats" placeholder="Any%|100%|All Bosses"></div><button class="btn" onclick="addGame()">추가</button></div>
    <div class="card"><h2>🌐 speedrun.com 에서 가져오기</h2><div class="admin-row"><input id="src-q" placeholder="게임 이름 (영문)" style="flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px" onkeydown="if(event.key==='Enter')srcSearch()"><button class="btn" onclick="srcSearch()">검색</button></div><div id="src-out" style="margin-top:10px"></div>
    <div class="mini" style="margin-top:8px">검색 → "가져오기"를 누르면 게임 + 공식 카테고리 + 커버 이미지가 자동으로 들어갑니다. (수천 개 게임 모두 가능)</div></div>
    <div class="card" style="margin-top:16px"><h2>📨 게임 추가 요청함</h2><p class="mini">유저가 "게임 추가 요청"을 보낼 수 있게 하려면 요청함을 활성화하세요. 요청은 심사 대기 탭에 비고로 표시됩니다.</p><button class="btn ghost sm" onclick="enableReqBox()">요청함 활성화</button></div></div>
  <div><div class="card"><h2>🎮 게임 선택 / 카테고리 편집</h2><select onchange="window._adGame=+this.value;adGames()" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px"><option value="">게임 선택…</option>${sortedGames("").map(x=>`<option value="${x.id}" ${x.id===sel?"selected":""}>${esc(x.name)}</option>`).join("")}</select>
    ${g?`<div style="margin-top:14px"><div class="field"><label>이름</label><input id="eg-name" value="${esc(g.name)}"></div><div class="row2"><div class="field"><label>장르</label><input id="eg-genre" value="${esc(g.genre||"")}"></div><div class="field"><label>커버 URL</label><input id="eg-cover" value="${esc(g.cover_url||"")}"></div></div><div class="admin-row"><button class="btn sm" onclick="saveGame(${g.id})">저장</button><button class="btn bad sm" onclick="delGame(${g.id})">게임 삭제</button></div>
    <h2 style="margin-top:18px">카테고리</h2>${(cats||[]).map(c=>`<div class="admin-row" style="margin-bottom:6px"><input value="${esc(c.name)}" onchange="renameCat(${c.id},this.value)" style="flex:1;border:1px solid var(--line);border-radius:6px;padding:6px 8px"><input placeholder="규칙" value="${esc(c.rules||"")}" onchange="ruleCat(${c.id},this.value)" style="flex:2;border:1px solid var(--line);border-radius:6px;padding:6px 8px"><button class="btn bad sm" onclick="delCat(${c.id})">삭제</button></div>`).join("")}
    <div class="admin-row" style="margin-top:8px"><input id="nc-name" placeholder="새 카테고리" style="flex:1;border:1px solid var(--line);border-radius:6px;padding:6px 8px"><button class="btn sm" onclick="addCat(${g.id})">추가</button></div></div>`:""}</div></div></div>`;
}
async function addGame(){ const name=$("#ng-name").value.trim(), abbr=$("#ng-abbr").value.trim()||name.toLowerCase().replace(/[^a-z0-9]/g,""); if(!name) return toast("이름 필요");
  const {data,error}=await sb.from("games").insert({name,abbr,genre:$("#ng-genre").value||null,release_year:$("#ng-year").value?+$("#ng-year").value:null}).select().single(); if(error) return toast(error.message);
  const cats=$("#ng-cats").value.split("|").map(s=>s.trim()).filter(Boolean); if(cats.length) await sb.from("categories").insert(cats.map(n=>({game_id:data.id,name:n}))); else await sb.from("categories").insert({game_id:data.id,name:"Any%"});
  await loadGames(); window._adGame=data.id; toast("게임 추가됨"); adGames(); }
async function saveGame(id){ await sb.from("games").update({name:$("#eg-name").value,genre:$("#eg-genre").value||null,cover_url:$("#eg-cover").value||null}).eq("id",id); await loadGames(); toast("저장됨"); }
async function delGame(id){ if(!confirm("게임과 모든 기록이 삭제됩니다. 계속?")) return; await sb.from("games").delete().eq("id",id); await loadGames(); window._adGame=null; adGames(); }
async function addCat(gid){ const n=$("#nc-name").value.trim(); if(!n) return; await sb.from("categories").insert({game_id:gid,name:n}); adGames(); }
async function renameCat(id,n){ await sb.from("categories").update({name:n}).eq("id",id); toast("저장됨"); }
async function ruleCat(id,r){ await sb.from("categories").update({rules:r||null}).eq("id",id); toast("저장됨"); }
async function delCat(id){ if(!confirm("카테고리와 그 기록이 삭제됩니다. 계속?")) return; await sb.from("categories").delete().eq("id",id); adGames(); }
async function enableReqBox(){ const {data:ex}=await sb.from("games").select("id").eq("abbr","__requests").maybeSingle(); if(ex) return toast("이미 활성화됨");
  const {data}=await sb.from("games").insert({name:"[게임 추가 요청함]",abbr:"__requests",genre:"시스템"}).select().single(); await sb.from("categories").insert({game_id:data.id,name:"요청"}); await loadGames(); toast("활성화됨"); }
async function srcSearch(){ const q=$("#src-q").value.trim(); if(!q) return; $("#src-out").innerHTML="<div class='mini'>검색 중…</div>";
  try{ const r=await fetch(`https://www.speedrun.com/api/v1/games?name=${encodeURIComponent(q)}&max=10`); const j=await r.json();
    window._srcRes=j.data||[]; $("#src-out").innerHTML=window._srcRes.map((g,i)=>`<div class="admin-row" style="padding:6px 0;border-bottom:1px solid #f1f2f4"><img src="${esc(g.assets?.["cover-tiny"]?.uri||"")}" style="width:28px;height:38px;object-fit:cover;border-radius:4px"><span style="flex:1"><b>${esc(g.names.international)}</b> <span class="mini">${g.released||""} · ${esc(g.abbreviation)}</span></span><button class="btn sm" onclick="srcImport(${i})">가져오기</button></div>`).join("")||"<div class='mini'>결과 없음</div>";
  }catch(e){ $("#src-out").innerHTML=`<div class="mini" style="color:var(--bad)">speedrun.com 접속 실패 (${esc(e.message)}). 직접 추가를 이용하세요.</div>`; } }
async function srcImport(i){ const g=window._srcRes[i]; if(!g) return;
  const {data:game,error}=await sb.from("games").upsert({name:g.names.international,abbr:g.abbreviation,cover_url:g.assets?.["cover-medium"]?.uri||null,release_year:g.released||null,src_id:g.id,platforms:null},{onConflict:"abbr"}).select().single(); if(error) return toast(error.message);
  try{ const r=await fetch(`https://www.speedrun.com/api/v1/games/${g.id}/categories`); const j=await r.json(); const cats=(j.data||[]).filter(c=>c.type==="per-game").map(c=>({game_id:game.id,name:c.name,rules:(c.rules||"").slice(0,500)||null}));
    if(cats.length) await sb.from("categories").upsert(cats,{onConflict:"game_id,name",ignoreDuplicates:true}); }catch{}
  await loadGames(); window._adGame=game.id; toast(`${g.names.international} 가져옴`); adGames(); }

async function adHardest(){
  const {data}=await sb.from("hardest").select("*, games(name), categories(name), profiles:holder_user_id(nickname)").order("position");
  $("#admin-body").innerHTML=`<div class="card" style="margin-bottom:16px"><h2>➕ 항목 추가</h2><div class="row2"><div class="field"><label>순위</label><input id="h-pos" type="number" value="${(data?.length||0)+1}"></div><div class="field"><label>제목</label><input id="h-title" placeholder="예: Celeste 200 Berries"></div></div>
    <div class="row2"><div class="field"><label>게임</label><select id="h-game" onchange="hCats()"><option value="">선택</option>${sortedGames("").map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></div><div class="field"><label>카테고리</label><select id="h-cat"><option value="">선택</option></select></div></div>
    <div class="row2"><div class="field"><label>포인트</label><input id="h-pts" type="number" value="100"></div><div class="field"><label>보유자 닉네임 (선택)</label><input id="h-holder" placeholder="기록 보유자"></div></div>
    <div class="field"><label>설명</label><input id="h-desc"></div><div class="field"><label>영상 URL</label><input id="h-video"></div><button class="btn" onclick="addHard()">추가</button></div>
  <div class="card" style="padding:0"><table><tr><th>순위</th><th>제목</th><th>게임</th><th>포인트</th><th>보유자</th><th></th></tr>${(data||[]).map(h=>`<tr><td><input type="number" value="${h.position}" style="width:60px;border:1px solid var(--line);border-radius:6px;padding:4px" onchange="hardUpd(${h.id},{position:+this.value})"></td><td><input value="${esc(h.title)}" style="border:1px solid var(--line);border-radius:6px;padding:4px;width:100%" onchange="hardUpd(${h.id},{title:this.value})"></td><td>${esc(h.games?.name||"-")}${h.categories?" · "+esc(h.categories.name):""}</td><td><input type="number" value="${h.points}" style="width:70px;border:1px solid var(--line);border-radius:6px;padding:4px" onchange="hardUpd(${h.id},{points:+this.value})"></td><td>${esc(h.profiles?.nickname||"-")}</td><td><button class="btn bad sm" onclick="delHard(${h.id})">삭제</button></td></tr>`).join("")}</table></div>`;
}
async function hCats(){ const gid=+$("#h-game").value; const {data}=gid?await sb.from("categories").select("*").eq("game_id",gid):{data:[]}; $("#h-cat").innerHTML=`<option value="">선택</option>`+(data||[]).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join(""); }
async function addHard(){ const title=$("#h-title").value.trim(); if(!title) return toast("제목 필요"); let holder=null; const hn=$("#h-holder").value.trim(); if(hn){ const {data}=await sb.from("profiles").select("id").eq("nickname",hn).maybeSingle(); holder=data?.id||null; if(!holder) toast("보유자 닉네임을 찾지 못해 비워둠"); }
  const {error}=await sb.from("hardest").insert({position:+$("#h-pos").value||1,title,game_id:+$("#h-game").value||null,category_id:+$("#h-cat").value||null,points:+$("#h-pts").value||100,description:$("#h-desc").value||null,video_url:$("#h-video").value||null,holder_user_id:holder}); if(error) return toast(error.message); adHardest(); }
async function hardUpd(id,patch){ await sb.from("hardest").update(patch).eq("id",id); toast("저장됨"); }
async function delHard(id){ await sb.from("hardest").delete().eq("id",id); adHardest(); }

async function adAiLog(){ const {data}=await sb.from("ai_log").select("*").order("created_at",{ascending:false}).limit(50);
  $("#admin-body").innerHTML=`<div class="card" style="padding:0"><table><tr><th>시간</th><th>제출#</th><th>판정</th><th>사유</th><th>영상 보고</th></tr>${(data||[]).map(l=>`<tr><td class="mini">${fmtDT(l.created_at)}</td><td>${l.submission_id}</td><td><span class="badge b-${l.decision==="approve"?"approved":l.decision==="reject"?"rejected":"pending"}">${l.decision}</span></td><td class="mini">${esc(l.reason)}</td><td class="mini" style="max-width:380px;white-space:pre-wrap">${esc(l.video_report||"")}</td></tr>`).join("")||`<tr><td colspan=5 class="empty">AI 심사 기록 없음 (관리자가 ${settings.admin_idle_minutes}분 이상 자리를 비우고 대기 제출이 있을 때만 작동)</td></tr>`}</table></div>`; }

async function adSettings(){
  $("#admin-body").innerHTML=`<div class="card" style="max-width:720px">
    <div class="field"><label>사이트 이름</label><input id="st-site" value="${esc(settings.site_name||"")}"></div>
    <div class="field"><label>AI 대리 심사</label><select id="st-ai"><option value="true" ${settings.ai_enabled==="true"?"selected":""}>켜짐</option><option value="false" ${settings.ai_enabled!=="true"?"selected":""}>꺼짐</option></select></div>
    <div class="row2"><div class="field"><label>관리자 부재 기준 (분)</label><input id="st-idle" type="number" value="${esc(settings.admin_idle_minutes||10)}"><div class="hint">이 시간 동안 관리자 페이지가 열려있지 않으면 AI가 대신 심사</div></div>
    <div class="field"><label>승인 → 고정 지연 (초)</label><input id="st-delay" type="number" value="${esc(settings.publish_delay_seconds||20)}"><div class="hint">1분 이내 보장을 위해 40 이하 권장</div></div></div>
    <div class="field"><label>등재 가이드라인</label><textarea id="st-guide" rows="6">${esc(settings.guideline||"")}</textarea></div>
    <div class="field"><label>CRON_SECRET (AI 즉시 호출 버튼용, Edge Function 의 CRON_SECRET 과 동일)</label><input id="st-cron" value="${esc(settings.cron_secret_hint||"")}"><div class="hint">⚠ 공개 DB에 저장되므로 간단한 값 사용. 비워두면 "AI에게 지금 심사" 버튼은 크론만 기다립니다.</div></div>
    <button class="btn" onclick="saveSettings()">저장</button>
    <div class="mini" style="margin-top:16px">API 키(GROQ/GEMINI)는 Supabase Edge Function Secrets 에만 저장됩니다. 사이트에는 절대 넣지 마세요.</div></div>`;
}
async function saveSettings(){ const rows=[["site_name",$("#st-site").value],["ai_enabled",$("#st-ai").value],["admin_idle_minutes",$("#st-idle").value],["publish_delay_seconds",$("#st-delay").value],["guideline",$("#st-guide").value],["cron_secret_hint",$("#st-cron").value]].map(([key,value])=>({key,value}));
  const {error}=await sb.from("settings").upsert(rows); if(error) return toast(error.message); await loadSettings(); toast("저장됨"); }

init();
</script>
</body>
</html>
